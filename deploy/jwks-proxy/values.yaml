replicaCount: 2

image:
  repository: ghcr.io/lukaspj/jwks-proxy
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  create: true
  name: ""
  annotations: {}

# Rendered into a config.yaml mounted into the container.
# Set externalUrl and upstreamTemplate here, or use existingConfigMap
# for full control.
config:
  listen: ":8080"
  externalUrl: ""       # required – e.g. https://jwks-proxy.com
  upstreamTemplate: ""  # required – e.g. https://idp.example.com/application/o/{route}
  cacheTtlSeconds: 300

# Use an existing ConfigMap holding a config.yaml (mounted as config.yaml
# in /config) instead of rendering one from `config` above.
existingConfigMap: ""

service:
  type: ClusterIP
  port: 80

probes:
  liveness:
    initialDelaySeconds: 2
    periodSeconds: 10
  readiness:
    initialDelaySeconds: 2
    periodSeconds: 5

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi

automountServiceAccountToken: false

podSecurityContext:
  runAsNonRoot: true
  # Matches the nonroot user in the distroless image (uid/gid 65532).
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  privileged: false
  capabilities:
    drop: [ALL]

podAnnotations: {}

nodeSelector: {}
tolerations: []
affinity: {}
